name: Feature idea
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the problem or moment in your writing routine, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: Works fully offline / local-first (no accounts, no tracking)
        - label: I'd be interested in helping build this
